<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Agent Control Room quick guide</title>
  <desc id="desc">Four simple steps explain how to use the Agent Control Room: start a task, follow the handoff, read the timeline, and check the operators.</desc>
  <rect width="1600" height="1000" fill="#f5f3ed"/>
  <rect x="52" y="52" width="1496" height="896" rx="8" fill="none" stroke="#d6d2c7" stroke-width="2"/>
  <circle cx="118" cy="122" r="34" fill="#262520"/><text x="118" y="135" text-anchor="middle" fill="#f5f3ed" font-size="37" font-family="Georgia">π</text>
  <text x="178" y="111" fill="#7f7c72" font-size="17" font-family="monospace" letter-spacing="3">PI AGENTS / QUICK GUIDE</text>
  <text x="178" y="157" fill="#262520" font-size="42" font-family="Arial, sans-serif" font-weight="700">How to read the Control Room</text>
  <text x="120" y="235" fill="#7f7c72" font-size="22" font-family="Arial, sans-serif">You do not need to understand the code. Follow the four signals below.</text>
  <line x1="120" y1="285" x2="1480" y2="285" stroke="#d6d2c7" stroke-width="2"/>

  <g transform="translate(120 355)">
    <circle cx="40" cy="40" r="40" fill="#e5644f"/><text x="40" y="52" text-anchor="middle" fill="#fff" font-size="29" font-family="Arial" font-weight="700">1</text>
    <text x="110" y="27" fill="#262520" font-size="29" font-family="Arial" font-weight="700">Start a task</text>
    <text x="110" y="65" fill="#7f7c72" font-size="20" font-family="Arial">Press “Run next task” in the top right.</text>
    <rect x="110" y="105" width="310" height="62" fill="#262520"/><text x="136" y="144" fill="#f5f3ed" font-size="19" font-family="Arial">Run next task</text><text x="383" y="144" fill="#f2c7a4" font-size="27" font-family="Arial">↗</text>
  </g>
  <g transform="translate(800 355)">
    <circle cx="40" cy="40" r="40" fill="#a8cbbb"/><text x="40" y="52" text-anchor="middle" fill="#262520" font-size="29" font-family="Arial" font-weight="700">2</text>
    <text x="110" y="27" fill="#262520" font-size="29" font-family="Arial" font-weight="700">Follow the handoff</text>
    <text x="110" y="65" fill="#7f7c72" font-size="20" font-family="Arial">The left panel shows where work is going.</text>
    <g transform="translate(110 108)"><rect width="360" height="58" fill="#ebe8df"/><text x="18" y="25" fill="#e5644f" font-size="14" font-family="monospace">01</text><text x="72" y="25" fill="#262520" font-size="17" font-family="Arial" font-weight="700">Incoming task</text><text x="72" y="47" fill="#7f7c72" font-size="13" font-family="Arial">your request enters here</text></g>
  </g>

  <g transform="translate(120 650)">
    <circle cx="40" cy="40" r="40" fill="#9dbbd0"/><text x="40" y="52" text-anchor="middle" fill="#262520" font-size="29" font-family="Arial" font-weight="700">3</text>
    <text x="110" y="27" fill="#262520" font-size="29" font-family="Arial" font-weight="700">Read the timeline</text>
    <text x="110" y="65" fill="#7f7c72" font-size="20" font-family="Arial">The middle panel is the live story of each step.</text>
    <g transform="translate(110 105)"><circle cx="17" cy="20" r="14" fill="#e5644f"/><text x="17" y="26" text-anchor="middle" fill="#fff" font-size="16" font-family="Arial">⌁</text><text x="48" y="19" fill="#262520" font-size="17" font-family="Arial" font-weight="700">Tool call</text><text x="48" y="43" fill="#7f7c72" font-size="14" font-family="monospace">a worker is doing something</text></g>
  </g>
  <g transform="translate(800 650)">
    <circle cx="40" cy="40" r="40" fill="#f2c7a4"/><text x="40" y="52" text-anchor="middle" fill="#262520" font-size="29" font-family="Arial" font-weight="700">4</text>
    <text x="110" y="27" fill="#262520" font-size="29" font-family="Arial" font-weight="700">Check the operators</text>
    <text x="110" y="65" fill="#7f7c72" font-size="20" font-family="Arial">The right panel tells you who is working.</text>
    <g transform="translate(110 105)"><circle cx="21" cy="21" r="17" fill="#f2b2a4"/><text x="21" y="28" text-anchor="middle" fill="#262520" font-size="16" font-family="Georgia">O</text><text x="54" y="20" fill="#262520" font-size="17" font-family="Arial" font-weight="700">Orchestrator</text><circle cx="280" cy="21" r="6" fill="#e5644f"/><text x="54" y="45" fill="#e5644f" font-size="13" font-family="monospace">WORKING</text></g>
  </g>
  <line x1="120" y1="878" x2="1480" y2="878" stroke="#d6d2c7" stroke-width="2"/>
  <text x="120" y="917" fill="#7f7c72" font-size="16" font-family="monospace" letter-spacing="2">TIP</text><text x="190" y="917" fill="#262520" font-size="18" font-family="Arial">Green means complete. Coral means active. Gray means waiting.</text>
</svg>
